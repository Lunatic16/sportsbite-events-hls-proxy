# =============================================================================
# SportsRelay — Docker Compose deployment
#
#   docker compose up -d --build     # build & start
#   docker compose logs -f           # follow logs
#   docker compose down              # stop
# =============================================================================

services:
  sportsrelay:
    build:
      context: .
      dockerfile: Dockerfile
    image: sportsrelay:latest
    container_name: sportsrelay
    ports:
      # host:container — change the host port if 3000 is taken
      - "3004:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Extra upstream hosts allowed by the HLS relay beyond the defaults
      # (sportsbite.org, embed.sportsbite.org, *.cr7goated.site).
      # Comma-separated, e.g. "cdn-a.example.net,cdn-b.example.net".
      HLS_EXTRA_ALLOWED_HOSTS: "${HLS_EXTRA_ALLOWED_HOSTS:-}"
      # Schedule proxy tuning (minutes are seconds here: upstream cache TTL).
      SCHEDULE_CACHE_TTL_MS: "${SCHEDULE_CACHE_TTL_MS:-60000}"
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
